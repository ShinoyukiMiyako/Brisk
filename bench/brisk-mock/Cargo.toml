[package]
name = "brisk-mock"
description = "Paced OpenAI-compatible SSE upstream with in-band timestamps for Brisk benchmarks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "brisk-mock"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
brisk-bench-core = { workspace = true }
clap = { workspace = true }
httparse = { workspace = true }
memchr = { workspace = true }
mio = { workspace = true, features = ["os-poll", "os-ext", "net"] }
rustls = { workspace = true, features = ["aws_lc_rs", "std", "tls12"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt"] }

[lints]
workspace = true
