[package]
name = "brisk-floor"
description = "floor-A: an empty blind-forwarding proxy that measures the cost of the Brisk connection layer plus the upstream HTTP/1.1 client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
brisk-bench-core = { workspace = true }
brisk-gateway = { workspace = true }
clap = { workspace = true }
http = { workspace = true }
hyper = { workspace = true, features = ["server", "http1", "http2"] }
reqwest = { workspace = true, features = ["rustls", "stream"] }
rustls-pki-types = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal", "macros"] }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
mimalloc = { workspace = true }

[dev-dependencies]
bytes = { workspace = true }
http-body-util = { workspace = true, features = ["channel"] }
hyper = { workspace = true, features = ["client", "http1", "http2"] }
hyper-util = { workspace = true, features = ["tokio"] }
tokio = { workspace = true, features = ["io-util", "time"] }

[lints]
workspace = true
