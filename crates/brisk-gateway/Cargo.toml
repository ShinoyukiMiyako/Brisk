[package]
name = "brisk-gateway"
description = "Brisk data-plane gateway: inbound connection layer, upstream client stack, request forwarding and settlement."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
axum = { workspace = true }
base64 = { workspace = true }
brisk-proto = { workspace = true }
bytes = { workspace = true }
fastrand = { workspace = true }
hashbrown = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["server", "http1", "http2"] }
hyper-util = { workspace = true, features = ["server", "server-auto", "server-graceful", "http1", "http2", "service", "tokio"] }
reqwest = { workspace = true, features = ["rustls", "stream"] }
rustls-pki-types = { workspace = true }
sha2 = { workspace = true }
socket2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "macros"] }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["std", "process"] }

[dev-dependencies]
brisk-bench-core = { workspace = true }
brisk-mock = { workspace = true }
dhat = { workspace = true }
h2 = { workspace = true }
http-body-util = { workspace = true, features = ["channel"] }
httparse = { workspace = true }
hyper = { workspace = true, features = ["client"] }
proptest = { workspace = true }
rcgen = { workspace = true, features = ["aws_lc_rs", "pem"] }
rustls = { workspace = true, features = ["aws_lc_rs", "std"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "io-util", "test-util"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs"] }

[lints]
workspace = true
