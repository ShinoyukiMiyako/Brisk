[package]
name = "brisk-gateway"
description = "Brisk data-plane gateway: inbound connection layer and upstream client construction."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
http = { workspace = true }
http-body = { workspace = true }
hyper = { workspace = true, features = ["server", "http1", "http2"] }
hyper-util = { workspace = true, features = ["server", "server-auto", "server-graceful", "http1", "http2", "tokio"] }
reqwest = { workspace = true, features = ["rustls", "stream"] }
rustls-pki-types = { workspace = true }
socket2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "macros"] }
tokio-rustls = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["std", "process"] }

[dev-dependencies]
bytes = { workspace = true }
h2 = { workspace = true }
http-body-util = { workspace = true, features = ["channel"] }
hyper = { workspace = true, features = ["client"] }
rcgen = { workspace = true, features = ["aws_lc_rs", "pem"] }
rustls = { workspace = true, features = ["aws_lc_rs", "std"] }
tokio = { workspace = true, features = ["rt-multi-thread", "io-util"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs"] }

[lints]
workspace = true
