[package]
name = "brisk-proto"
description = "Brisk protocol layer: synchronous request-head parsing, request-body splicing, SSE framing and usage extraction."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

# Pure synchronous code: scripts/check-deps.sh fails if tokio, hyper, reqwest
# or axum ever shows up among these.
[dependencies]
bytes = { workspace = true }
memchr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = { workspace = true }

[dev-dependencies]
dhat = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
